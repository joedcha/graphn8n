# Plantilla de Zabbix para el monitoreo de n8n via n8n-zabbix-bridge.
#
# IMPORTANTE: este archivo se escribio a mano siguiendo el esquema de
# exportacion YAML de plantillas de Zabbix 6.0, pero no se pudo probar un
# import real contra un Zabbix (este entorno no tiene acceso a la red
# interna). Antes de usarlo en produccion:
#   1. Importar en un Zabbix de prueba (Data collection > Templates > Import).
#   2. Si el import falla, Zabbix va a indicar la linea/campo con problema:
#      son ajustes menores de sintaxis, no de diseno.
#   3. Crear un host (por ejemplo "n8n-telefonica", debe coincidir con
#      ZABBIX_HOST_NAME en bridge/.env) y asociarle esta plantilla.
#
# Los items base (no descubiertos) se alimentan del workflow de gobernanza.
# La regla de discovery se alimenta del modulo discovery.js del bridge y
# crea automaticamente items/triggers por cada workflow de n8n.

zabbix_export:
  version: '6.0'
  groups:
    - uuid: a5a57a7dea424582a83c71545c181984
      name: Templates/Applications
  templates:
    - uuid: 3b798be4b0b04ea3b7e7239876c715ff
      template: 'Template App n8n Bridge'
      name: 'Template App n8n Bridge'
      groups:
        - name: Templates/Applications
      items:
        - uuid: f381d6671ddd4324be4aeec0f1564d42
          name: 'n8n - ratio de cumplimiento de gobernanza'
          type: TRAP
          key: n8n.governance.compliance_ratio
          value_type: FLOAT
          history: 90d
          trends: 365d
          description: 'Porcentaje de workflows activos que cumplen la convencion (Error Workflow + tags team/criticidad).'
        - uuid: f86fb0d3058548ceabae45fe82b26c68
          name: 'n8n - workflows no conformes (detalle JSON)'
          type: TRAP
          key: n8n.governance.non_compliant
          value_type: TEXT
          history: 30d
        - uuid: 356288407e844b67b113a528f76d7a3f
          name: 'n8n - capacidad: ejecuciones totales (todos los workflows)'
          type: TRAP
          key: n8n.capacity.executions.total
          value_type: UNSIGNED
          history: 90d
          trends: 365d
          description: 'Ejecuciones nuevas de TODOS los workflows desde el ultimo tick de capacity.py (no solo los criticos/tageados). Ver bridge-python/capacity.py.'
        - uuid: 6438fd4c75094fdeb0c0e061a5bf2c9b
          name: 'n8n - capacidad: ejecuciones con error'
          type: TRAP
          key: n8n.capacity.executions.errors
          value_type: UNSIGNED
          history: 90d
          trends: 365d
        - uuid: 4ba78463b9434b0f8fc10a8d12a63fa6
          name: 'n8n - capacidad: tasa de error (%)'
          type: TRAP
          key: n8n.capacity.executions.error_rate
          value_type: FLOAT
          units: '%'
          history: 90d
          trends: 365d
        - uuid: a193ae0fd7c54a048f49d92bcd3306ea
          name: 'n8n - capacidad: workflows con actividad'
          type: TRAP
          key: n8n.capacity.executions.active_workflows
          value_type: UNSIGNED
          history: 90d
          trends: 365d
          description: 'Cantidad de workflows distintos con al menos una ejecucion nueva en este tick.'
        - uuid: 09484ff0c81d4733ae1399a4be791135
          name: 'n8n - capacidad: duracion promedio (ms)'
          type: TRAP
          key: n8n.capacity.duration.avg_ms
          value_type: UNSIGNED
          units: ms
          history: 90d
          trends: 365d
          description: 'Duracion cruda (stoppedAt-startedAt del resumen de /executions, sin reconstruccion por nodos Wait) -- aproximacion agregada, no exacta por workflow. Ver capacity.py.'
        - uuid: c087680b0db34c76bd307a3edeb2fce4
          name: 'n8n - capacidad: duracion p95 (ms)'
          type: TRAP
          key: n8n.capacity.duration.p95_ms
          value_type: UNSIGNED
          units: ms
          history: 90d
          trends: 365d
        - uuid: a80b68da11c34d87b082675fd3f33493
          name: 'n8n - capacidad: workflows totales (inventario)'
          type: TRAP
          key: n8n.capacity.workflows.total
          value_type: UNSIGNED
          history: 90d
          trends: 365d
          description: 'Cantidad total de workflows en la instancia de n8n, activos e inactivos. Ver bridge-python/capacity.py.'
        - uuid: e3c4030d3c264e0292e9e37261fd0330
          name: 'n8n - capacidad: workflows activos'
          type: TRAP
          key: n8n.capacity.workflows.active
          value_type: UNSIGNED
          history: 90d
          trends: 365d
        - uuid: 399d3478de6e468c9e25f42c37e19e5f
          name: 'n8n - capacidad: workflows inactivos'
          type: TRAP
          key: n8n.capacity.workflows.inactive
          value_type: UNSIGNED
          history: 90d
          trends: 365d
        - uuid: 91eae30edafa4916ae7aa7111b2f63be
          name: 'n8n - capacidad: listado workflows activos (JSON)'
          type: TRAP
          key: n8n.capacity.workflows.active_names
          value_type: TEXT
          history: 14d
          description: 'Array JSON [{id, name}] de los workflows activos, ordenado por nombre. Ver bridge-python/capacity.py.'
        - uuid: c41d1d02a42d45858fd7fefd3a2a3023
          name: 'n8n - capacidad: listado workflows inactivos (JSON)'
          type: TRAP
          key: n8n.capacity.workflows.inactive_names
          value_type: TEXT
          history: 14d
          description: 'Array JSON [{id, name}] de los workflows inactivos, ordenado por nombre. Ver bridge-python/capacity.py.'
        - uuid: c9166d96ff0140b3915557438421e2b5
          name: 'n8n - capacidad: listado todos los workflows (JSON)'
          type: TRAP
          key: n8n.capacity.workflows.all_names
          value_type: TEXT
          history: 14d
          description: 'Array JSON [{id, name, active}] de todos los workflows (341), ordenado por nombre. Ver bridge-python/capacity.py.'
      discovery_rules:
        - uuid: 9a5f7082676e436489cf5a823456b129
          name: 'n8n - descubrimiento de workflows'
          type: TRAP
          key: n8n.workflow.discovery
          lifetime: 30d
          item_prototypes:
            - uuid: 29090aa3c64040e7a6af0968a515f034
              name: 'Workflow {#WORKFLOW_NAME} - duracion ultima ejecucion'
              type: TRAP
              key: 'n8n.workflow.duration.last[{#WORKFLOW_ID}]'
              value_type: UNSIGNED
              units: ms
              history: 90d
              trends: 365d
              tags:
                - tag: team
                  value: '{#TEAM}'
                - tag: criticidad
                  value: '{#CRITICALITY}'
            - uuid: 19768118cab64d359bcdd4d87d5854c1
              name: 'Workflow {#WORKFLOW_NAME} - estado ultima ejecucion'
              type: TRAP
              key: 'n8n.workflow.status.last[{#WORKFLOW_ID}]'
              value_type: UNSIGNED
              valuemap:
                name: 'n8n execution status'
              history: 90d
            - uuid: a96bda94a42d4af0bdd9153f3305b87e
              name: 'Workflow {#WORKFLOW_NAME} - tiempos por nodo (JSON)'
              type: TRAP
              key: 'n8n.workflow.nodes.timing[{#WORKFLOW_ID}]'
              value_type: TEXT
              history: 30d
            - uuid: 89c27a17ad3a423c9a9d1b1eb0d65159
              name: 'Workflow {#WORKFLOW_NAME} - ultimo error (JSON)'
              type: TRAP
              key: 'n8n.workflow.error.last[{#WORKFLOW_ID}]'
              value_type: TEXT
              history: 30d
          trigger_prototypes:
            - uuid: 374575e5d65349dea19d37a16c5077d1
              name: 'Workflow {#WORKFLOW_NAME}: fallo en la ultima ejecucion'
              expression: 'last(/Template App n8n Bridge/n8n.workflow.status.last[{#WORKFLOW_ID}])=1'
              priority: HIGH
            - uuid: c28d25cd7b6640d1b0eb460baf2ae0ac
              name: 'Workflow {#WORKFLOW_NAME}: duracion por encima del SLO ({#SLO_MS}ms)'
              expression: 'last(/Template App n8n Bridge/n8n.workflow.duration.last[{#WORKFLOW_ID}])>{#SLO_MS}'
              priority: WARNING
            - uuid: 3e744ddb9cbb41f59112bc08588f6d3b
              name: 'Workflow {#WORKFLOW_NAME}: sin ejecuciones recientes (heartbeat)'
              expression: 'nodata(/Template App n8n Bridge/n8n.workflow.duration.last[{#WORKFLOW_ID}],{$N8N.HEARTBEAT.WINDOW})=1'
              priority: AVERAGE
        - uuid: 1289dc3ff2d743f2a0ffe8b47ef092a5
          name: 'n8n - descubrimiento de nodos (workflows criticos)'
          type: TRAP
          key: n8n.node.discovery
          lifetime: 30d
          description: >-
            Segundo nivel de LLD (ver plan de observabilidad, secciones 4.2 y
            8): a diferencia de n8n.workflow.discovery, los nodos de un
            workflow no se conocen de antemano, solo se ven al procesar
            ejecuciones. Alimentada por executions.js, que va acumulando los
            nombres de nodo vistos por workflow critico (tag criticidad:alta)
            y reenvia el set completo conocido en cada tick.
          item_prototypes:
            - uuid: cc8dc00ae1ce4c7bb62845ff5008228b
              name: 'Workflow {#WORKFLOW_NAME} - nodo {#NODE_NAME} - duracion'
              type: TRAP
              key: 'n8n.node.duration[{#WORKFLOW_ID},{#NODE_NAME}]'
              value_type: UNSIGNED
              units: ms
              history: 90d
              trends: 365d
      macros:
        - macro: '{$N8N.HEARTBEAT.WINDOW}'
          value: '1d'
          description: 'Ventana sin datos que dispara la alerta de heartbeat.'
        - macro: '{$N8N.GOVERNANCE.MIN_RATIO}'
          value: '0.9'
      valuemaps:
        - uuid: 1100fbb4750642ad9ccbb762bb26249a
          name: 'n8n execution status'
          mappings:
            - value: '0'
              newvalue: success
            - value: '1'
              newvalue: error
  triggers:
    - uuid: 80738e4a41aa421e8840457c3f8e159c
      name: 'n8n: cumplimiento de gobernanza por debajo del umbral'
      expression: 'last(/Template App n8n Bridge/n8n.governance.compliance_ratio)<{$N8N.GOVERNANCE.MIN_RATIO}'
      priority: WARNING
